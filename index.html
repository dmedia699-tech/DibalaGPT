
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Dibala Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#101010;padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;z-index:5}
.logo{font-size:24px;font-weight:800;color:white}
.logo span{color:#ff3155}
button,.upload-btn{border:0;border-radius:24px;padding:12px 16px;background:#ff3155;color:white;font-weight:bold;font-size:14px;cursor:pointer}
main{max-width:650px;margin:auto;padding:16px}
.intro{color:#bbb;line-height:1.5}
.upload{border:1px dashed #666;border-radius:16px;padding:20px;text-align:center;margin:20px 0}
.upload input{display:none}
.upload-btn{display:inline-block;margin-top:10px}
#feed{display:grid;gap:20px}
.video-card{background:#1b1b1b;border:1px solid #333;border-radius:16px;overflow:hidden}
video{width:100%;max-height:65vh;background:#000;display:block}
.details{padding:14px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.secondary{background:#333}
.notice{color:#aaa;font-size:13px;line-height:1.5}
.empty{text-align:center;color:#aaa;padding:30px 10px}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>
<header>
  <div class="logo">Dibala<span>Video</span></div>
  <button onclick="document.getElementById('videoFile').click()">+ Upload</button>
</header>

<main>
  <h2>Discover videos 🎬</h2>
  <p class="intro">Watch videos. Share your creativity. Welcome to Dibala Video!</p>

  <section class="upload">
    <h3>Share your video</h3>
    <p class="notice">Choose a video from your phone to preview it.</p>
    <label class="upload-btn" for="videoFile">Choose video</label>
    <input id="videoFile" type="file" accept="video/*">
    <p class="notice">Prototype: videos are not yet shared with other users.</p>
  </section>

  <h3>Video feed</h3>
  <section id="feed">
    <div class="empty" id="empty">No videos yet. Choose a video to get started!</div>
  </section>
</main>

<footer>© 2026 Dibala Video</footer>

<script>
const picker = document.getElementById('videoFile');
const feed = document.getElementById('feed');
const empty = document.getElementById('empty');

picker.addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;

  if (!file.type.startsWith('video/')) {
    alert('Please choose a video file.');
    return;
  }

  const url = URL.createObjectURL(file);
  const card = document.createElement('article');
  card.className = 'video-card';

  const video = document.createElement('video');
  video.src = url;
  video.controls = true;
  video.playsInline = true;
  video.preload = 'metadata';

  const details = document.createElement('div');
  details.className = 'details';

  const title = document.createElement('h3');
  title.textContent = file.name;

  const info = document.createElement('p');
  info.className = 'notice';
  info.textContent = 'Local preview • ' +
    (file.size / (1024 * 1024)).toFixed(1) + ' MB';

  const actions = document.createElement('div');
  actions.className = 'actions';

  const like = document.createElement('button');
  like.className = 'secondary';
  like.textContent = '♡ Like 0';
  let likes = 0;
  like.onclick = () => {
    likes++;
    like.textContent = '♥ Like ' + likes;
  };

  const remove = document.createElement('button');
  remove.className = 'secondary';
  remove.textContent = 'Remove';
  remove.onclick = () => {
    URL.revokeObjectURL(url);
    card.remove();
    if (!feed.querySelector('.video-card')) {
      feed.appendChild(empty);
      empty.style.display = 'block';
    }
  };

  actions.append(like, remove);
  details.append(title, info, actions);
  card.append(video, details);

  empty.style.display = 'none';
  feed.prepend(card);
  picker.value = '';
});
</script>
</body>
</html>
